
name: Swiggy Instamart Keyword Deal Hunter

on:
  schedule:
    # Every 15 minutes, offset from :00 to reduce GitHub schedule congestion.
    # IST operating window: approximately 09:07 through 23:52.
    - cron: '37,52 3 * * *'
    - cron: '7,22,37,52 4-17 * * *'
    - cron: '7,22 18 * * *'

  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip top-of-hour wait sync (run immediately)'
        type: boolean
        required: false
        default: false
      test_telegram:
        description: 'Send a Telegram test message first (diagnose missing alerts)'
        type: boolean
        required: false
        default: false

concurrency:
  group: swiggy-instamart-deal-hunter
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  hunt:
    name: Worker (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker:
          - fresh
          - grocery
          - treats
          - munchies
          - beverages
          - personal
          - lifestyle

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: swiggy-telegram-bot/package-lock.json

      - name: Install Dependencies
        working-directory: swiggy-telegram-bot
        run: npm ci || npm install

      - name: Telegram Connection Test
        if: ${{ inputs.test_telegram }}
        working-directory: swiggy-telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIORITY_CHAT_ID: ${{ secrets.PRIORITY_CHAT_ID }}
          HEALTH_CHAT_ID: ${{ secrets.HEALTH_CHAT_ID }}
        run: node src/telegram-check.js

      - name: Restore Deal Cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deal-cache-${{ matrix.worker }}-

      - name: Remove Stale Price Observations
        working-directory: swiggy-telegram-bot
        shell: bash
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          case "$WORKER" in
            personal)
              rm -f data/price-observations-personalCare.json
              ;;
            *)
              rm -f "data/price-observations-${WORKER}.json"
              ;;
          esac

          echo "Prepared observations for $WORKER"

      - name: Run ${{ matrix.worker }} Deal Hunter
        working-directory: swiggy-telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          SWIGGY_STORE_ID: ${{ secrets.SWIGGY_STORE_ID }}
          SWIGGY_PRIMARY_STORE_ID: ${{ secrets.SWIGGY_PRIMARY_STORE_ID }}
          SWIGGY_SECONDARY_STORE_ID: ${{ secrets.SWIGGY_SECONDARY_STORE_ID }}
          SWIGGY_COOKIE: ${{ secrets.SWIGGY_COOKIE }}

          FRESH_MIN_DISCOUNT: ${{ secrets.FRESH_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          GROCERY_MIN_DISCOUNT: ${{ secrets.GROCERY_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          ESSENTIALS_MIN_DISCOUNT: ${{ secrets.ESSENTIALS_MIN_DISCOUNT }}
          TREATS_MIN_DISCOUNT: ${{ secrets.TREATS_MIN_DISCOUNT }}
          MUNCHIES_MIN_DISCOUNT: ${{ secrets.MUNCHIES_MIN_DISCOUNT || secrets.TREATS_MIN_DISCOUNT }}
          LIFESTYLE_MIN_DISCOUNT: ${{ secrets.LIFESTYLE_MIN_DISCOUNT }}
          BEVERAGES_MIN_DISCOUNT: ${{ secrets.BEVERAGES_MIN_DISCOUNT }}
          PERSONAL_MIN_DISCOUNT: ${{ secrets.PERSONAL_MIN_DISCOUNT }}

          ALERT_MODE: 'best_deals'
          BEST_DEAL_MIN_DISCOUNT: '50'

          PRIORITY_CHAT_ID: ${{ secrets.PRIORITY_CHAT_ID }}
          PRIORITY_THREAD_ID: ${{ secrets.PRIORITY_THREAD_ID }}
          NORMAL_THREAD_ID: ${{ secrets.NORMAL_THREAD_ID }}
          HEALTH_CHAT_ID: ${{ secrets.HEALTH_CHAT_ID }}
          QUIET_NORMAL_ALERTS: ${{ vars.QUIET_NORMAL_ALERTS }}
          MIN_GLITCH_MRP: ${{ vars.MIN_GLITCH_MRP }}

          USE_BROWSER: 'true'
          SKIP_SYNC: ${{ inputs.skip_sync }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

        shell: bash
        run: |
          EXTRA_FLAGS=""

          if [ "$SKIP_SYNC" = "true" ]; then
            EXTRA_FLAGS="--skip-sync"
          fi

          echo "Executing worker: ${{ matrix.worker }}"
          node src/cron-runner.js "${{ matrix.worker }}" $EXTRA_FLAGS

      - name: Save Deal Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Price Observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-observations-${{ matrix.worker }}
          path: swiggy-telegram-bot/data/price-observations-${{ matrix.worker == 'personal' && 'personalCare' || matrix.worker }}.json
          if-no-files-found: ignore
          retention-days: 3

  update-history:
    name: Merge and Persist Price History
    needs: hunt
    if: always() && needs.hunt.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Worker Observations
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: price-observations-*
          path: swiggy-telegram-bot/data
          merge-multiple: true

      - name: Merge Price History
        working-directory: swiggy-telegram-bot
        shell: bash
        run: |
          if compgen -G "data/price-observations-*.json" > /dev/null; then
            node src/merge-price-history.js
          else
            echo "No observation files found; history unchanged."
          fi

      - name: Commit Updated History
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add swiggy-telegram-bot/price-history.json

          if git diff --cached --quiet; then
            echo "No price-history changes to commit."
          else
            git commit -m "Update Instamart price history"
            git push
          fi

  notify-failures:
    name: Notify On Worker Failure
    needs: hunt
    if: always() && needs.hunt.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send Telegram Alert
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.HEALTH_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets missing; skipping."
            exit 0
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🛑 Deal Hunter: one or more workers FAILED. Details: ${RUN_URL}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
